name: zenith-crm

services:
  app:
    image: zenith-crm-app:local
    build:
      context: .
      # NEXT_PUBLIC_* vars are inlined at build time - forward them
      # from .env.local via `docker compose --env-file .env.local ...`.
      # Supabase values remain temporarily required while the migration
      # to standalone PostgreSQL/Auth/Realtime/Storage is in progress.
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-}
        NEXT_PUBLIC_APP_LOCALE: ${NEXT_PUBLIC_APP_LOCALE:-en}
    env_file:
      - .env.local
    environment:
      PORT: 3000
      # Container-internal endpoints. These override host-oriented values
      # from .env.local so the same file works for local Node and Compose.
      DATABASE_URL: postgresql://${POSTGRES_USER:-zenith}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-zenith_crm}
      REDIS_URL: redis://redis:6379
    ports:
      - '${HOST_PORT:-3000}:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000').then((r)=>process.exit(r.ok||r.status<500?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  wacalls:
    image: zenith-wacalls:local
    build:
      context: ./infra/wacalls
      dockerfile: Dockerfile.zenith
    ports:
      - '127.0.0.1:${WACALLS_PORT:-18080}:8080'
    volumes:
      - wacalls_data:/data
    restart: unless-stopped
  voice-events-worker:
    image: zenith-crm-app:local
    command: ['node', 'scripts/voice-events-worker.mjs']
    env_file:
      - .env.local
    environment:
      VOICE_WORKER_APP_URL: http://app:3000
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    # pgvector image keeps the project compatible with the existing AI
    # knowledge migrations while remaining standard PostgreSQL 16.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zenith_crm}
      POSTGRES_USER: ${POSTGRES_USER:-zenith}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:
  wacalls_data:
